<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="Simple offline bodyweight exercise animations"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Home Calisthenics</title>
<style>
:root{font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;color:#171717;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #eab200;outline-offset:3px}main{max-width:650px;margin:0 auto;min-height:100dvh;background:white;display:flex;flex-direction:column;box-shadow:0 0 35px #00000008}.top{padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:13px;letter-spacing:.13em;font-weight:750;text-transform:uppercase;color:#777}.count{font-size:13px;color:#666}.heading{padding:10px 20px 0}.heading h1{font-size:clamp(26px,6vw,36px);margin:0 0 8px;line-height:1.12}.muscles{font-size:14px;color:#555;min-height:22px}.tag{display:inline-block;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:#f0f0ed;color:#555;margin-top:10px}.scene{flex:1;min-height:260px;display:flex;align-items:center;justify-content:center;padding:8px 8px;touch-action:pan-y;user-select:none}.scene img{display:block;width:100%;max-width:460px;max-height:min(57dvh,540px);object-fit:contain;pointer-events:none}.controls{padding:0 20px 18px}.mainbuttons{display:flex;gap:12px;align-items:center;justify-content:space-between}.btn{border:1px solid #d6d6d6;background:#fff;border-radius:14px;padding:15px 18px;min-width:63px;font-size:17px;font-weight:650}.btn.primary{background:#161616;color:white;border-color:#161616;flex:1}.btn:active{transform:scale(.98)}.progress{height:4px;background:#e7e7e7;border-radius:8px;overflow:hidden;margin:18px 0}.progress span{height:100%;display:block;background:#eab200;transition:width .22s}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}.picker{width:100%;padding:12px;border:1px solid #d9d9d9;border-radius:12px;background:white;font-size:15px}.secondary{font-size:12px;color:#717171;text-align:center;margin:13px 0 0}.status{font-size:12px;color:#666;text-align:center;padding:0 10px 10px}.status[data-ready=true]{color:#34744c}@media(min-width:720px){main{min-height:740px;margin:20px auto;border-radius:24px;overflow:hidden}.scene{min-height:360px}}@media(max-height:650px){.scene img{max-height:45dvh}.scene{min-height:150px}.top{padding-top:12px}.controls{padding-bottom:8px}}
.topright{display:flex;align-items:center;gap:12px}.settings-btn{background:#f2f2ef;border:1px solid #ddd;border-radius:10px;padding:9px 11px;font-size:13px;font-weight:700}.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:99}.settings-panel{width:min(100%,540px);max-height:90dvh;display:flex;flex-direction:column;background:white;border-radius:20px;overflow:hidden;box-shadow:0 18px 80px #0004}.settings-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px 0}.settings-head h2{margin:0;font-size:23px}.close-btn{border:0;background:transparent;font-size:24px;padding:4px 10px}.settings-help{font-size:13px;color:#555;padding:0 19px;line-height:1.5}.settings-actions{display:flex;gap:8px;padding:6px 19px 14px}.settings-actions button{border:1px solid #ddd;background:#f6f6f5;border-radius:10px;padding:8px 12px}.settings-list{overflow:auto;padding:0 19px;flex:1;overscroll-behavior:contain}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:11px 0;cursor:pointer}.setting-row .title{font-weight:650;font-size:14px}.setting-row .sub{color:#777;font-size:12px;margin-top:3px}.setting-row input{accent-color:#111;width:22px;height:22px;flex-shrink:0}.settings-bottom{border-top:1px solid #eee;padding:14px 19px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.settings-bottom button{background:#111;color:white;border:0;border-radius:11px;padding:11px 24px;font-weight:700}body.settings-open{overflow:hidden}@media(max-width:400px){.topright{gap:7px}.settings-btn{padding:8px}.top{padding-left:13px;padding-right:13px}.brand{font-size:11px}} </style></head><body><main>
<div class="top"><div class="brand">Home Calisthenics</div><div class="topright"><div class="count" id="count">1 / 20</div><button class="settings-btn" id="openSettings" aria-label="Exercise settings" title="Settings">⚙ Settings</button></div></div>
<div class="heading"><h1 id="name">Push-up</h1><div class="muscles" id="muscles"></div><span class="tag" id="type">REPETITIONS</span></div>
<div class="scene" id="scene" aria-label="Exercise animation. Swipe left or right to change exercise"><img id="frame" alt="Animated exercise instruction"></div>
<div class="controls"><div class="progress"><span id="progress" style="width:10%"></span></div>
<div class="mainbuttons"><button class="btn" id="prev" aria-label="Previous exercise">❮</button><button class="btn primary" id="play" aria-label="Pause animation">❚❚ Pause</button><button class="btn" id="next" aria-label="Next exercise">❯</button></div>
<div class="row"><label for="pick" style="font-size:13px;font-weight:650">Choose exercise</label></div><select class="picker" id="pick" aria-label="Choose exercise"></select><div class="secondary">Swipe left or right on the drawing to change exercises.</div></div>
<div class="status" id="status">Offline files are being prepared…</div>
<div class="modal" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-panel"><div class="settings-head"><h2 id="settingsTitle">Choose exercises</h2><button class="close-btn" id="closeSettings" aria-label="Close settings">✕</button></div><p class="settings-help">Switch exercises on or off. Your choices are saved on this phone, and skipped when swiping.</p><div class="settings-actions"><button id="selectAll">Select all</button><button id="deselectAll">Deselect all</button></div><div class="settings-list" id="settingsList"></div><div class="settings-bottom"><span id="enabledCount">20 selected</span><button id="doneSettings">Done</button></div></div></div></main><script>
const exercises = [{"name": "Push-up", "stem": "01_push-up", "muscles": "Chest · Triceps · Front shoulders", "kind": "reps"}, {"name": "Knee push-up", "stem": "02_knee_push-up", "muscles": "Chest · Triceps · Front shoulders", "kind": "reps"}, {"name": "Pike push-up", "stem": "03_pike_push-up", "muscles": "Shoulders · Triceps", "kind": "reps"}, {"name": "Chair triceps dip", "stem": "04_chair_triceps_dip", "muscles": "Triceps · Chest · Front shoulders", "kind": "reps"}, {"name": "Plank shoulder tap", "stem": "05_plank_shoulder_tap", "muscles": "Core · Shoulders · Chest", "kind": "reps"}, {"name": "Forearm plank", "stem": "06_forearm_plank", "muscles": "Core · Shoulders", "kind": "hold"}, {"name": "Side plank", "stem": "07_side_plank", "muscles": "Obliques · Core · Glutes", "kind": "hold"}, {"name": "Abdominal crunch", "stem": "08_abdominal_crunch", "muscles": "Rectus abdominis", "kind": "reps"}, {"name": "Bicycle crunch", "stem": "09_bicycle_crunch", "muscles": "Obliques · Rectus abdominis", "kind": "reps"}, {"name": "Lying leg raise", "stem": "10_lying_leg_raise", "muscles": "Abdominals · Hip flexors", "kind": "reps"}, {"name": "Dead bug", "stem": "11_dead_bug", "muscles": "Deep core · Hip flexors", "kind": "reps"}, {"name": "Bird dog", "stem": "12_bird_dog", "muscles": "Core · Lower back · Glutes", "kind": "reps"}, {"name": "Bodyweight squat", "stem": "13_bodyweight_squat", "muscles": "Quadriceps · Glutes", "kind": "reps"}, {"name": "Reverse lunge", "stem": "14_reverse_lunge", "muscles": "Quadriceps · Glutes · Hamstrings", "kind": "reps"}, {"name": "Split squat", "stem": "15_split_squat", "muscles": "Quadriceps · Glutes", "kind": "reps"}, {"name": "Glute bridge", "stem": "16_glute_bridge", "muscles": "Glutes · Hamstrings", "kind": "reps"}, {"name": "Calf raise", "stem": "17_calf_raise", "muscles": "Calves", "kind": "reps"}, {"name": "Jumping jack", "stem": "18_jumping_jack", "muscles": "Calves · Shoulders · Glutes", "kind": "reps"}, {"name": "Mountain climber", "stem": "19_mountain_climber", "muscles": "Core · Hip flexors · Shoulders", "kind": "reps"}, {"name": "Burpee", "stem": "20_burpee", "muscles": "Quadriceps · Glutes · Chest · Core", "kind": "reps"}];
const storageKey='home-calisthenics-exercise-selection-v2';
let enabled;try{const saved=JSON.parse(localStorage.getItem(storageKey));enabled=Array.isArray(saved)&&saved.length===exercises.length?saved.map(Boolean):exercises.map(()=>true)}catch{enabled=exercises.map(()=>true)}
if(!enabled.some(Boolean))enabled[0]=true;
let current=enabled.findIndex(Boolean),frame=0,playing=true,last=0,raf=0;
const el={img:document.getElementById('frame'),name:document.getElementById('name'),muscles:document.getElementById('muscles'),type:document.getElementById('type'),count:document.getElementById('count'),progress:document.getElementById('progress'),pick:document.getElementById('pick'),play:document.getElementById('play'),scene:document.getElementById('scene'),status:document.getElementById('status'),settings:document.getElementById('settings'),settingsList:document.getElementById('settingsList'),enabledCount:document.getElementById('enabledCount')};
function activeIndices(){return exercises.map((x,i)=>enabled[i]?i:-1).filter(i=>i>=0)}
function framePath(i,f){return 'frames/'+exercises[i].stem+'_'+f+'.webp'}
function paint(){el.img.src=framePath(current,frame)}
function buildPicker(){el.pick.replaceChildren();activeIndices().forEach((i,j)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(j+1)+'. '+exercises[i].name;el.pick.appendChild(o)})}
function select(i){if(!enabled[i])i=activeIndices()[0];current=i;frame=0;last=0;const x=exercises[current],active=activeIndices();el.name.textContent=x.name;el.muscles.textContent='Targets: '+x.muscles;el.type.textContent=x.kind==='hold'?'TIMED HOLD':'REPETITIONS';el.count.textContent=(active.indexOf(current)+1)+' / '+active.length;el.progress.style.width=((active.indexOf(current)+1)*100/active.length)+'%';el.pick.value=String(current);el.img.alt=x.name+' exercise demonstration';paint()}
function move(delta){const a=activeIndices(),i=a.indexOf(current);select(a[(i+delta+a.length)%a.length])}
function setPlaying(value){playing=value;el.play.textContent=playing?'❚❚ Pause':'▶ Play';el.play.setAttribute('aria-label',playing?'Pause animation':'Play animation');last=0}
function tick(now){if(playing){if(!last)last=now;if(now-last>=190){frame=(frame+1)%6;paint();last=now}}raf=requestAnimationFrame(tick)}
function persist(){localStorage.setItem(storageKey,JSON.stringify(enabled));if(!enabled[current])current=activeIndices()[0];buildPicker();select(current);renderSettings()}
function renderSettings(){const previousScroll=el.settingsList.scrollTop;el.settingsList.replaceChildren();exercises.forEach((x,i)=>{const row=document.createElement('label');row.className='setting-row';const left=document.createElement('span');const title=document.createElement('div');title.className='title';title.textContent=x.name;const sub=document.createElement('div');sub.className='sub';sub.textContent=x.muscles;left.append(title,sub);const check=document.createElement('input');check.type='checkbox';check.checked=enabled[i];check.setAttribute('aria-label','Enable '+x.name);check.addEventListener('change',()=>{enabled[i]=check.checked;if(!enabled.some(Boolean)){enabled[i]=true;check.checked=true;alert('Keep at least one exercise switched on.')}persist()});row.append(left,check);el.settingsList.appendChild(row)});el.enabledCount.textContent=activeIndices().length+' of '+exercises.length+' selected';el.settingsList.scrollTop=previousScroll}
function settingsOpen(value){el.settings.hidden=!value;document.body.classList.toggle('settings-open',value);if(value)renderSettings()}
document.getElementById('openSettings').addEventListener('click',()=>settingsOpen(true));document.getElementById('closeSettings').addEventListener('click',()=>settingsOpen(false));document.getElementById('doneSettings').addEventListener('click',()=>settingsOpen(false));el.settings.addEventListener('click',e=>{if(e.target===el.settings)settingsOpen(false)});
document.getElementById('selectAll').addEventListener('click',()=>{enabled=exercises.map(()=>true);persist()});document.getElementById('deselectAll').addEventListener('click',()=>{enabled=exercises.map(()=>false);enabled[current]=true;persist()});
document.getElementById('prev').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));el.play.addEventListener('click',()=>setPlaying(!playing));el.pick.addEventListener('change',()=>select(Number(el.pick.value)));
let startX=null,startY=null;el.scene.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});el.scene.addEventListener('touchend',e=>{if(startX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1);startX=null;startY=null},{passive:true});document.addEventListener('keydown',e=>{if(!el.settings.hidden){if(e.key==='Escape')settingsOpen(false);return}if(e.target===el.pick)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();setPlaying(!playing)}});
buildPicker();select(current);raf=requestAnimationFrame(tick);
async function offline(){if(!('serviceWorker'in navigator)||!window.isSecureContext){el.status.textContent='Open from an HTTPS website to install and enable offline use.';return}try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const urls=exercises.flatMap((_,i)=>Array.from({length:6},(_,f)=>framePath(i,f)));const c=await caches.open('calisthenics-v2-1');await c.addAll(urls);el.status.dataset.ready='true';el.status.textContent='✓ Ready for offline use'}catch(e){el.status.textContent='Offline setup incomplete; reconnect and reload to retry.';console.warn(e)}}offline();
</script></body></html>
