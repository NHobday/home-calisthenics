<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="description" content="Simple offline bodyweight exercise animations"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Home Calisthenics</title>
<style>
:root{font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;color:#171717;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #eab200;outline-offset:3px}main{max-width:650px;margin:0 auto;min-height:100dvh;background:white;display:flex;flex-direction:column;box-shadow:0 0 35px #00000008}.top{padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:13px;letter-spacing:.13em;font-weight:750;text-transform:uppercase;color:#777}.count{font-size:13px;color:#666}.heading{padding:10px 20px 0}.heading h1{font-size:clamp(26px,6vw,36px);margin:0 0 8px;line-height:1.12}.muscles{font-size:14px;color:#555;min-height:22px}.tag{display:inline-block;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;background:#f0f0ed;color:#555;margin-top:10px}.scene{flex:1;min-height:260px;display:flex;align-items:center;justify-content:center;padding:8px 8px;touch-action:pan-y;user-select:none}.scene img{display:block;width:100%;max-width:460px;max-height:min(57dvh,540px);object-fit:contain;pointer-events:none}.controls{padding:0 20px 18px}.mainbuttons{display:flex;gap:12px;align-items:center;justify-content:space-between}.btn{border:1px solid #d6d6d6;background:#fff;border-radius:14px;padding:15px 18px;min-width:63px;font-size:17px;font-weight:650}.btn.primary{background:#161616;color:white;border-color:#161616;flex:1}.btn:active{transform:scale(.98)}.progress{height:4px;background:#e7e7e7;border-radius:8px;overflow:hidden;margin:18px 0}.progress span{height:100%;display:block;background:#eab200;transition:width .22s}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}.picker{width:100%;padding:12px;border:1px solid #d9d9d9;border-radius:12px;background:white;font-size:15px}.secondary{font-size:12px;color:#717171;text-align:center;margin:13px 0 0}.status{font-size:12px;color:#666;text-align:center;padding:0 10px 10px}.status[data-ready=true]{color:#34744c}@media(min-width:720px){main{min-height:740px;margin:20px auto;border-radius:24px;overflow:hidden}.scene{min-height:360px}}@media(max-height:650px){.scene img{max-height:45dvh}.scene{min-height:150px}.top{padding-top:12px}.controls{padding-bottom:8px}}
</style></head><body><main>
<div class="top"><div class="brand">Home Calisthenics</div><div class="count" id="count">1 / 10</div></div>
<div class="heading"><h1 id="name">Push-up</h1><div class="muscles" id="muscles"></div><span class="tag" id="type">REPETITIONS</span></div>
<div class="scene" id="scene" aria-label="Exercise animation. Swipe left or right to change exercise"><img id="frame" alt="Animated exercise instruction"></div>
<div class="controls"><div class="progress"><span id="progress" style="width:10%"></span></div>
<div class="mainbuttons"><button class="btn" id="prev" aria-label="Previous exercise">❮</button><button class="btn primary" id="play" aria-label="Pause animation">❚❚ Pause</button><button class="btn" id="next" aria-label="Next exercise">❯</button></div>
<div class="row"><label for="pick" style="font-size:13px;font-weight:650">Choose exercise</label></div><select class="picker" id="pick" aria-label="Choose exercise"></select><div class="secondary">Swipe left or right on the drawing to change exercises.</div></div>
<div class="status" id="status">Offline files are being prepared…</div>
</main><script>
const exercises = [{"name": "Push-up", "stem": "01_push-up", "muscles": "Chest · Triceps · Front shoulders", "kind": "reps"}, {"name": "Knee push-up", "stem": "02_knee_push-up", "muscles": "Chest · Triceps · Front shoulders", "kind": "reps"}, {"name": "Pike push-up", "stem": "03_pike_push-up", "muscles": "Shoulders · Triceps", "kind": "reps"}, {"name": "Chair triceps dip", "stem": "04_chair_triceps_dip", "muscles": "Triceps · Chest · Front shoulders", "kind": "reps"}, {"name": "Plank shoulder tap", "stem": "05_plank_shoulder_tap", "muscles": "Core · Shoulders · Chest", "kind": "reps"}, {"name": "Forearm plank", "stem": "06_forearm_plank", "muscles": "Core · Shoulders", "kind": "hold"}, {"name": "Side plank", "stem": "07_side_plank", "muscles": "Obliques · Core · Glutes", "kind": "hold"}, {"name": "Abdominal crunch", "stem": "08_abdominal_crunch", "muscles": "Rectus abdominis", "kind": "reps"}, {"name": "Bicycle crunch", "stem": "09_bicycle_crunch", "muscles": "Obliques · Rectus abdominis", "kind": "reps"}, {"name": "Lying leg raise", "stem": "10_lying_leg_raise", "muscles": "Abdominals · Hip flexors", "kind": "reps"}];
let current=0,frame=0,playing=true,last=0,raf=0;
const el={img:document.getElementById('frame'),name:document.getElementById('name'),muscles:document.getElementById('muscles'),type:document.getElementById('type'),count:document.getElementById('count'),progress:document.getElementById('progress'),pick:document.getElementById('pick'),play:document.getElementById('play'),scene:document.getElementById('scene'),status:document.getElementById('status')};
function framePath(i,f){return 'frames/'+exercises[i].stem+'_'+f+'.webp'}
function paint(){el.img.src=framePath(current,frame)}
function select(i){current=(i+exercises.length)%exercises.length;frame=0;last=0;const x=exercises[current];el.name.textContent=x.name;el.muscles.textContent='Targets: '+x.muscles;el.type.textContent=x.kind==='hold'?'TIMED HOLD':'REPETITIONS';el.count.textContent=(current+1)+' / '+exercises.length;el.progress.style.width=((current+1)*100/exercises.length)+'%';el.pick.value=String(current);el.img.alt=x.name+' exercise demonstration';paint()}
function setPlaying(value){playing=value;el.play.textContent=playing?'❚❚ Pause':'▶ Play';el.play.setAttribute('aria-label',playing?'Pause animation':'Play animation');last=0}
function tick(now){if(playing){if(!last)last=now;if(now-last>=190){frame=(frame+1)%6;paint();last=now}}raf=requestAnimationFrame(tick)}
exercises.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+x.name;el.pick.appendChild(o)});
document.getElementById('prev').addEventListener('click',()=>select(current-1));document.getElementById('next').addEventListener('click',()=>select(current+1));el.play.addEventListener('click',()=>setPlaying(!playing));el.pick.addEventListener('change',()=>select(Number(el.pick.value)));
let startX=null,startY=null;el.scene.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});el.scene.addEventListener('touchend',e=>{if(startX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)select(current+(dx<0?1:-1));startX=null;startY=null},{passive:true});document.addEventListener('keydown',e=>{if(e.target===el.pick)return;if(e.key==='ArrowRight')select(current+1);if(e.key==='ArrowLeft')select(current-1);if(e.key===' '){e.preventDefault();setPlaying(!playing)}});
select(0);raf=requestAnimationFrame(tick);
async function offline(){if(!('serviceWorker'in navigator)||!window.isSecureContext){el.status.textContent='Open from an HTTPS website to install and enable offline use.';return}try{await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;const urls=exercises.flatMap((_,i)=>Array.from({length:6},(_,f)=>framePath(i,f)));const c=await caches.open('calisthenics-v1a-1');await c.addAll(urls);el.status.dataset.ready='true';el.status.textContent='✓ Ready for offline use'}catch(e){el.status.textContent='Offline setup incomplete; reconnect and reload to retry.';console.warn(e)}}offline();
</script></body></html>
